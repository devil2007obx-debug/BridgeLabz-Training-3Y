<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
</head>

<body>

    <h1>Internship Application Form</h1>

    <form>

        <!-- Personal Details -->
        <h2>Personal Details</h2>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" 
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" 
               placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" 
               placeholder="Enter phone number" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" 
               placeholder="Create password" required>
        <br><br>


        <!-- Gender -->
        <label>Gender:</label>
        <br>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>


        <!-- Educational Details -->
        <h2>Educational Details</h2>

        <label for="course">Select Course:</label>

        <select id="course" name="course" required>
            <option value="">--Select Course--</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="Mechanical">Mechanical</option>
        </select>

        <br><br>


        <!-- Skills -->
        <label>Skills:</label>
        <br>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label>

        <br><br>


        <!-- Internship Preference -->
        <h2>Internship Preference</h2>

        <input type="radio" id="frontend" name="internship" value="Frontend Development" required>
        <label for="frontend">Frontend Development</label>

        <input type="radio" id="backend" name="internship" value="Backend Development">
        <label for="backend">Backend Development</label>

        <input type="radio" id="cybersecurity" name="internship" value="Cybersecurity">
        <label for="cybersecurity">Cybersecurity</label>

        <br><br>


        <!-- Resume Upload -->
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" required>
        <br><br>


        <!-- Cover Letter -->
        <label for="coverletter">Cover Letter:</label>
        <br>

        <textarea id="coverletter" name="coverletter" 
                  rows="5" cols="40" 
                  placeholder="Write your cover letter here..." required></textarea>

        <br><br>


        <!-- Buttons -->
        <input type="submit" value="Submit Application">

        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
