<hr>

<h2 id="registration">
    Student Registration Form
</h2>


<form>


<!-- Text Input -->

<label for="fullname">
    Full Name:
</label>

<br>

<input 
type="text" 
id="fullname"
name="fullname"
placeholder="Enter your full name"
required>


<br><br>



<!-- Email Input -->

<label for="email">
    Email:
</label>

<br>

<input 
type="email"
id="email"
name="email"
placeholder="Enter your email"
required>


<br><br>




<!-- Password Input -->

<label for="password">
    Password:
</label>

<br>

<input 
type="password"
id="password"
name="password"
placeholder="Enter password"
required>


<br><br>




<!-- Radio Buttons -->

<label>
Gender:
</label>

<br>


<input 
type="radio"
id="male"
name="gender"
value="Male">

<label for="male">
Male
</label>



<input 
type="radio"
id="female"
name="gender"
value="Female">

<label for="female">
Female
</label>



<input 
type="radio"
id="other"
name="gender"
value="Other">

<label for="other">
Other
</label>


<br><br>




<!-- Checkbox -->

<label>
Technical Skills:
</label>

<br>


<input 
type="checkbox"
id="html"
name="skills">

<label for="html">
HTML
</label>



<input 
type="checkbox"
id="css"
name="skills">

<label for="css">
CSS
</label>



<input 
type="checkbox"
id="javascript"
name="skills">

<label for="javascript">
JavaScript
</label>



<input 
type="checkbox"
id="python"
name="skills">

<label for="python">
Python
</label>


<br><br>





<!-- Dropdown -->

<label for="course">
Select Course:
</label>

<br>


<select id="course" name="course">


<option>
--Select Course--
</option>


<option>
B.Tech Computer Science
</option>


<option>
BCA
</option>


<option>
MCA
</option>


<option>
B.Sc
</option>


</select>


<br><br>





<!-- Text Area -->

<label for="message">
Message:
</label>

<br>


<textarea 
id="message"
name="message"
rows="5"
cols="40"
placeholder="Enter your message">
</textarea>


<br><br>





<!-- Submit Button -->

<input 
type="submit"
value="Submit Form">


<input 
type="reset"
value="Clear">


</form>
