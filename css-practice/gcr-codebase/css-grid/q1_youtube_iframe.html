<html>
<head>
    <title>Question 1 - YouTube Video Embed</title>
</head>
<body>

    <h1>Embedding a YouTube Video</h1>

    <!-- 
        The iframe below uses width="80%" and height="60%" (percentage values only, no pixels).
        This makes the video frame responsive/resizable as the browser window changes size.
        Note: height in percentage works properly only if the parent container has a defined height,
        so for a simple standalone page you may notice the effect more clearly by resizing width.
    -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="Sample YouTube Video">
    </iframe>

</body>
</html>
