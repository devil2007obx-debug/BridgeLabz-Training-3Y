<body>

    <h1>Quotations Example</h1>

    <!-- Long quotation using blockquote -->
    <blockquote>
        Education is the most powerful weapon which you can use to change the world &amp; 
        make it a better place for everyone.
    </blockquote>

    <!-- Short quotation using q, embedded inside a paragraph -->
    <p>
        As someone once said, <q>knowledge is power</q>, and it continues to shape how we
        approach learning today.
    </p>
