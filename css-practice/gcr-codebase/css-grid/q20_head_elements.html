<html>
<head>

    <!-- Sets the character encoding for the document so special characters display correctly -->
    <meta charset="UTF-8">

    <!-- Provides a short description of the page, often used by search engines -->
    <meta name="description" content="A demonstration page showing all important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Abhishek Tomar">

    <!-- Sets the base URL for all relative links used in the page -->
    <base href="https://example.com/">

    <!-- Links an external resource, here a favicon icon, to the page -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Used to write internal CSS styles (left empty as per assignment instructions) -->

    </style>

    <!-- Used to write internal JavaScript code (left empty as per assignment instructions) -->

    </script>

    <!-- Sets the title shown on the browser tab -->

</head>
<body>

    <h1>Demonstration of Head Elements</h1>
    <p>This page's head section includes meta tags, a base tag, a link tag, an empty style tag, and an empty script tag, each explained with comments in the source code.</p>
