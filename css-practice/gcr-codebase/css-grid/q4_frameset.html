<!DOCTYPE html>
<!-- 
  Assignment 3 - Question 4
  Author: Abhishek Tomar
  Task: Frameset layout with top frame (navigation) and bottom frame (welcome message).
  Note: <frameset> is an obsolete HTML tag (not supported in HTML5 / most modern browsers),
  but it is included here as per the assignment requirement for learning purposes.
-->
<html>
<head>
    <title>Question 4 - Frameset Layout</title>
</head>
<frameset rows="20%,80%">
    <!-- Top frame: Navigation links -->
    <frame src="nav.html" title="Navigation Frame">
    <!-- Bottom frame: Welcome message -->
    <frame src="welcome.html" title="Welcome Frame">
</frameset>
</html>
