<!DOCTYPE html>

  Task: Demonstrate URI encoding by encoding special characters in a URL.

<html>
<head>
    <title>Question 16 - URI Encoding Demonstration</title>
</head>
<body>

    <h1>URI Encoding Example</h1>

    <p>Original (unencoded) URL: https://example.com/search?query=HTML & CSS</p>

    <!-- 
        The space character is encoded as %20 in a properly encoded URI.
        The correct encoded version of the link above is shown below.
    -->
    <p>
        Encoded link:
        <a href="https://example.com/search?query=HTML%20&%20CSS">
            https://example.com/search?query=HTML%20&%20CSS
        </a>
    </p>

</body>
</html>
