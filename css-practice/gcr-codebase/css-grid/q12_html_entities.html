<html>
<head>
    <title>Question 12 - HTML Entities</title>
</head>
<body>

    <h1>HTML Entities Demonstration</h1>

    <!-- 
        &lt;  represents <
        &gt;  represents >
        &amp; represents &
        &quot; represents "
        &#39; (or &apos;) represents '
    -->
    <p>
        Less than: &lt;<br>
        Greater than: &gt;<br>
        Ampersand: &amp;<br>
        Double Quote: &quot;<br>
        Single Quote: &#39;
    </p>

    <!-- Copyright, Trademark, and Registered symbols -->
    <p>
        Copyright: &copy;<br>
        Trademark: &trade;<br>
        Registered: &reg;
    </p>

</body>
</html>
