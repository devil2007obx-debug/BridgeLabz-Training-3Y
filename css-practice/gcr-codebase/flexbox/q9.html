<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            font-family: Arial;
        }

        .card {
            width: 300px;
            height: 250px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .front {
            background: lightblue;
        }

        .front img {
            width: 200px;
        }

        .back {
            background: lightgreen;
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="card-inner">

            <div class="front">
                <h2>Web Development</h2>
                <img src="https://picsum.photos/250/150">
            </div>

            <div class="back">
                <h2>About</h2>
                <p>
                    Web development is used to create
                    websites and web applications.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
