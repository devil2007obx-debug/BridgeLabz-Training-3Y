<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            height: 150px;
            padding: 20px;
            background: lightblue;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h3>Laptop</h3>
            <p>₹50,000</p>
        </div>

        <div class="card">
            <h3>Mobile</h3>
            <p>₹25,000</p>
        </div>

        <div class="card">
            <h3>Headphones</h3>
            <p>₹2,000</p>
        </div>

        <div class="card">
            <h3>Keyboard</h3>
            <p>₹1,500</p>
        </div>

        <div class="card">
            <h3>Mouse</h3>
            <p>₹800</p>
        </div>

        <div class="card">
            <h3>Monitor</h3>
            <p>₹12,000</p>
        </div>

        <div class="card">
            <h3>Tablet</h3>
            <p>₹20,000</p>
        </div>

        <div class="card">
            <h3>Speaker</h3>
            <p>₹3,000</p>
        </div>

    </div>

</body>
</html>
