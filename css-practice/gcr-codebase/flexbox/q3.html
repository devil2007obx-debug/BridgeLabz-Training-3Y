<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial;
        }

        header {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #222;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .box {
            padding: 60px;
            background: lightblue;
            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 600px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </header>

    <main>
        <div class="box">Services</div>
        <div class="box">Projects</div>
        <div class="box">Contact</div>
    </main>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
