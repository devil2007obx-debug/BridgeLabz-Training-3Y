<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        .blog {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 20px;
            padding: 20px;
        }

        header {
            grid-area: header;
            background: #222;
            color: white;
            padding: 20px;
        }

        aside {
            grid-area: sidebar;
            background: #ddd;
            padding: 20px;
        }

        main {
            grid-area: main;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        article {
            padding: 20px;
            background: lightblue;
        }

        footer {
            grid-area: footer;
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 800px) {
            .blog {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "footer";
            }

            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="blog">

        <header>
            <h1>My Blog</h1>
            <nav>Home | About | Contact</nav>
        </header>

        <aside>
            <h3>Categories</h3>
            <p>Technology</p>
            <p>Programming</p>
            <p>Cybersecurity</p>
            <p>AI</p>
        </aside>

        <main>

            <article>
                <h2>Learning HTML and CSS</h2>
                <p>
                    HTML creates the structure of a webpage
                    and CSS designs it.
                </p>
            </article>

            <article>
                <h2>Introduction to AI</h2>
                <p>
                    Artificial Intelligence allows machines
                    to perform intelligent tasks.
                </p>
            </article>

        </main>

        <footer>
            Contact: example@gmail.com
        </footer>

    </div>

</body>
</html>
