<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intro html form</title>
    <link rel=stylesheet href="firstone.css">
    <style>
        <p> {
            
        }
    </style>

</head>
<body >
    <form>
        <fieldset>
            <legend>REGISTERATION FORM</legend>
        <label for="Email">Enter email :</label>
        <input type="text" id="Email" placeholder="Email"><br><br>
        <label for="Password">Enter password :</label>
        <input type="password" id="Password" placeholder="Password"><br><br>
        <label for="date">Enter date :</label>
        <input type="date" id="date" ?><br><br>
         <label for="course">Select course :</label>
        <select id="course" id="Selection">
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>

        </select><br></br>
        <label for="radio">Gender:</label><br>
        <input type="radio" id="radio" name="gender" value="male">
        <label for="radio">Male</label>
        <input type="radio" id="radio" name="gender" value="female">
        <label for="radio">Female</label>
        <input type="radio" id="radio" name="gender" value="Other">
        <label for="radio">Other</label>
        <button>Reset</button>
        <br></br>
         <label for="checbox1">Select language:</label>
         <label for="checbox1">English</label>
         <input type="checkbox" id="checbox1" name="language" value="English">
         <label for="checbox3">Hindi</label>
         <input type="checkbox" id="checbox3" name="language" value="Hindi">
         <label for="checbox4">Sanskirit</label>
         <input type="checkbox" id="checbox4" name="language" value="Sanskirit"><br></br>




        <label for="file">Upload resume:</label><br>
         <input type="file" id="file" name="file"><br></br>

        <label for="textarea">Comments:</label><br>
        <textarea name="textarea1" id="textarea1"></textarea>
        <br></br>
        <button>Submit</button>
        <button>Reset</button>
     </fieldset>
    </form>
</body>
</html>
