<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4. Array Performance Analyzer</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: linear-gradient(135deg,#e8f0ff,#f8faff); color: #172033; }
.card { width: min(100%, 680px); background: white; border: 1px solid #dce4f2; border-radius: 18px; padding: 28px; box-shadow: 0 12px 35px rgba(26,45,85,.10); }
h1 { font-size: 1.55rem; margin: 0 0 10px; }
p { line-height: 1.5; color: #58657a; }
button { border: 0; border-radius: 9px; background: #2457d6; color: white; font-weight: 700; padding: 11px 16px; cursor: pointer; margin: 8px 8px 8px 0; }
button:hover { background: #1944ad; }
button.secondary { background: #526078; }
.checks { display: grid; gap: 12px; margin: 18px 0; }
label { display: block; margin: 10px 0; }
textarea { width: 100%; min-height: 95px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #101827; color: #e6edf7; padding: 18px; border-radius: 12px; min-height: 70px; line-height: 1.55; }
.hint { font-size: .88rem; }
</style>
</head>
<body>
<main class="card">
<h1>Q4. Array Performance Analyzer</h1>
<p>Generates random scores and calculates maximum, minimum, average, and passing count.</p>

<button onclick="run()">Run code</button>
<pre id="output">Click “Run code” to see the result.</pre>
<p class="hint">All HTML, CSS, and JavaScript are combined in this single file. Open it in Chrome, Edge, or Firefox.</p>
</main>
<script>

function run() {
  // Generate eight integer scores from 30 through 100.
  const scores = Array.from({ length: 8 }, () =>
    Math.floor(Math.random() * 71) + 30
  );
  const highest = Math.max(...scores);
  const lowest = Math.min(...scores);
  const total = scores.reduce((sum, score) => sum + score, 0);
  const average = total / scores.length;
  const passed = scores.filter(score => score >= 50).length;

  document.getElementById("output").textContent =
    `Scores: ${scores.join(", ")}\n` +
    `Highest score: ${highest}\n` +
    `Lowest score: ${lowest}\n` +
    `Average score: ${average.toFixed(2)}\n` +
    `Students passed (score ≥ 50): ${passed} of ${scores.length}`;
}

</script>
</body>
</html>
