<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q9 – JSON Audit</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf2fb;font-family:Arial,sans-serif;color:#172033}
main{width:min(100%,760px);background:#fff;padding:28px;border:1px solid #d9e2f0;border-radius:16px;box-shadow:0 12px 32px #15294b18}
h1{font-size:1.5rem;margin-top:0}p{line-height:1.5;color:#59667b}label{display:block;margin:12px 0 6px}
input,select{width:100%;max-width:360px;padding:10px;border:1px solid #c8d2e1;border-radius:8px;font:inherit}
button{margin:16px 0;background:#2457d6;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer}

</style></head><body><main>
<h1>Q9 – JSON Audit</h1><p>Parses JSON, validates keys, converts age to Number, and records errors with line numbers.</p>
<button onclick="run()">Run code</button><pre id="output">Click “Run code” to see output.</pre>
<small>HTML, internal CSS, and JavaScript are combined in this file. Output is displayed on the page and with console.log().</small>
</main><script>
"use strict";
function run(){
 const rawData=['{"user":"Alex","age":25}','{"id":2}','{invalid}','{"user":"Mina","age":"22"}'],clean=[],errors=[];
 rawData.forEach((entry,i)=>{const line=i+1;try{
  const obj=JSON.parse(entry);
  if(!Object.prototype.hasOwnProperty.call(obj,"user")||!Object.prototype.hasOwnProperty.call(obj,"age"))throw new Error("Missing user or age key");
  const age=Number(obj.age);if(!Number.isFinite(age))throw new Error("Invalid age");
  if(age<18){console.log(`Line ${line}: under-18 filtered out`);return;}clean.push({...obj,age});
 }catch(e){errors.push(`Line ${line}: ${e.message}`);}});
 const result="Clean entries:\n"+JSON.stringify(clean,null,2)+"\n\nErrors:\n"+errors.join("\n")+"\nDebug: breakpoint inside forEach; inspect entry, clean, and errors.";
 console.log(result);document.getElementById("output").textContent=result;
}</script></body></html>
