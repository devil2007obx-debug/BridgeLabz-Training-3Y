<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q7 – Smart Calculator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf2fb;font-family:Arial,sans-serif;color:#172033}
main{width:min(100%,760px);background:#fff;padding:28px;border:1px solid #d9e2f0;border-radius:16px;box-shadow:0 12px 32px #15294b18}
h1{font-size:1.5rem;margin-top:0}p{line-height:1.5;color:#59667b}label{display:block;margin:12px 0 6px}
input,select{width:100%;max-width:360px;padding:10px;border:1px solid #c8d2e1;border-radius:8px;font:inherit}
button{margin:16px 0;background:#2457d6;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer}
pre{background:#111827;color:#e5edf8;padding:18px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;min-height:72px}
small{color:#64748b}
</style></head><body><main>
<h1>Q7 – Smart Calculator</h1><p>Select an operation. Errors are caught and displayed in the result summary.</p><label>Number 1</label><input id="num1" type="number" value="25"><label>Number 2</label><input id="num2" type="number" value="0"><label>Operation</label><select id="operation"><option>add</option><option>divide</option><option>power</option><option>root</option><option>subtract</option><option>multiply</option></select>
<button onclick="run()">Run code</button><pre id="output">Click “Run code” to see output.</pre>
<small>HTML, internal CSS, and JavaScript are combined in this file. Output is displayed on the page and with console.log().</small>
</main><script>
"use strict";
class InvalidOperationError extends Error{constructor(op){super("Unknown operation: "+op);this.name="InvalidOperationError";}}
function calculate(op,a,b){switch(op){
 case "add":return a+b;case "divide":if(b===0)throw new Error("Cannot divide by zero");return a/b;
 case "power":return Math.pow(a,b);case "root":if(a<0)throw new Error("Cannot find real square root of negative number");return Math.sqrt(a);
 case "subtract":return a-b;default:throw new InvalidOperationError(op);
}}
function run(){
 const a=Number(document.getElementById("num1").value),b=Number(document.getElementById("num2").value),op=document.getElementById("operation").value;let answer;
 try{answer=calculate(op,a,b);}catch(e){answer=`${e.name}: ${e.message}`;}
 const result=`Operation: ${op}\nNumber 1: ${a}\nNumber 2: ${b}\nResult: ${answer}`;
 console.log(result);document.getElementById("output").textContent=result;
}</script></body></html>
