<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q8. Employee Salary Projection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q8. Employee Salary Projection</h1>
  <p>5-year salary projection using a for loop.</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<label for="salary">Current salary (₹)</label><input type="number" id="salary" value="400000" min="0">
<label for="rate">Annual increment rate (%)</label><input type="number" id="rate" value="8" min="0" step="any">
<p class="small">Year 1 is the salary after the first yearly increment.</p>
<button type="submit">Project salary</button>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q8_salary_projection.js"></script>
</body>
</html>
