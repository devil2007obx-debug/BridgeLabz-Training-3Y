<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q5. Weather Activity Planner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q5. Weather Activity Planner</h1>
  <p>Suggests an activity from temperature, rain and wind speed.</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<label for="temperature">Temperature (°C)</label><input type="number" id="temperature" value="28">
<label for="windSpeed">Wind speed (km/h)</label><input type="number" id="windSpeed" value="10" min="0">
<label class="check"><input type="checkbox" id="isRaining"> It is raining</label>
<button type="submit">What should I do?</button>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q5_weather_planner.js"></script>
</body>
</html>
