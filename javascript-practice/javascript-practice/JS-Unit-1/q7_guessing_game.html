<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q7. Smart Guessing Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q7. Smart Guessing Game</h1>
  <p>Guess the secret number between 1 and 50.</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<label for="userGuess">Your guess (1-50)</label>
<input type="number" id="userGuess" min="1" max="50" value="25">
<button type="submit">Guess</button>
<button type="button" class="ghost" id="newGame">New game</button>
<p class="small" id="attempts">Attempts: 0</p>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q7_guessing_game.js"></script>
</body>
</html>
