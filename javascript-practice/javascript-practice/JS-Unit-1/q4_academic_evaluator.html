<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q4. Academic Performance Evaluator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q4. Academic Performance Evaluator</h1>
  <p>Average, percentage and result for 5 subjects (any mark below 35 means Detained).</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<div class="row">
<div><label for="m0">Subject 1</label><input type="number" id="m0" value="78" min="0" max="100"></div>
<div><label for="m1">Subject 2</label><input type="number" id="m1" value="82" min="0" max="100"></div>
<div><label for="m2">Subject 3</label><input type="number" id="m2" value="91" min="0" max="100"></div>
<div><label for="m3">Subject 4</label><input type="number" id="m3" value="67" min="0" max="100"></div>
<div><label for="m4">Subject 5</label><input type="number" id="m4" value="74" min="0" max="100"></div>
</div>
<p class="small">Each subject is out of 100.</p>
<button type="submit">Evaluate</button>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q4_academic_evaluator.js"></script>
</body>
</html>
