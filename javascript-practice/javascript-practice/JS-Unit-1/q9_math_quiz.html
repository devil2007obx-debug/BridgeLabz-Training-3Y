<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q9. Random Math Quiz Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q9. Random Math Quiz Generator</h1>
  <p>Random arithmetic questions solved with a switch statement.</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<p class="small">Your question</p>
<div class="question-box" id="question">-</div>
<label for="answer">Your answer</label>
<input type="number" id="answer" step="any" placeholder="Type your answer">
<button type="submit">Check answer</button>
<button type="button" class="ghost" id="newQuestion">New question</button>
<p class="small">For division, give your answer to 2 decimals.</p>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q9_math_quiz.js"></script>
</body>
</html>
