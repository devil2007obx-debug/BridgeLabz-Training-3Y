<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q10. Citizen Eligibility Validator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">Back to all questions</a>
  <h1>Q10. Citizen Eligibility Validator</h1>
  <p>Checks vote, drive and passport eligibility from age and citizenship.</p>
</header>
<main class="layout">
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">Input</h2>
    <form id="form" novalidate>
<label for="age">Age</label><input type="number" id="age" value="19" min="0">
<label class="check"><input type="checkbox" id="isCitizen" checked> Is a citizen</label>
<button type="submit">Check eligibility</button>
    </form>
  </section>
  <section aria-labelledby="out-heading">
    <h2 id="out-heading">Console output</h2>
    <div class="console" id="console" aria-live="polite"></div>
    <p class="hint">Same output is also printed in the browser console (press F12).</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/q10_eligibility_validator.js"></script>
</body>
</html>
