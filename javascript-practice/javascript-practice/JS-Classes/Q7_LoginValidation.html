<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 5px; }
        button { margin-top: 16px; padding: 10px 16px; }
        #message { margin-top: 14px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm" novalidate>
        <label>Username <input id="username" autocomplete="username"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Login</button>
    </form>
    <div id="message" aria-live="polite"></div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", event => {
            event.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errors = [];

            if (username.length < 5) errors.push("Username must be at least 5 characters.");
            if (password.length < 8) errors.push("Password must be at least 8 characters.");
            if (!/[A-Z]/.test(password)) errors.push("Password must contain an uppercase letter.");
            if (!/[a-z]/.test(password)) errors.push("Password must contain a lowercase letter.");
            if (!/\d/.test(password)) errors.push("Password must contain a number.");
            if (!/[^A-Za-z0-9]/.test(password)) errors.push("Password must contain a special character.");

            const message = document.getElementById("message");
            message.className = errors.length ? "error" : "success";
            message.textContent = errors.length ? errors.join(" ") : "Validation successful! Login details meet the required rules.";
        });
    </script>
</body>
</html>
