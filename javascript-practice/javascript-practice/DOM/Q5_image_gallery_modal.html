<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 850px; }
    .gallery img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 8px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-content { max-width: 90vw; max-height: 90vh; }
    .modal-content img { display: block; max-width: 90vw; max-height: 80vh; border-radius: 8px; }
    .close-button { display: block; margin: 0 0 10px auto; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Image Gallery</h1>
  <p>Click any image to preview it larger.</p>
  <div class="gallery" id="gallery">
    <img src="https://picsum.photos/id/1015/400/250" alt="Mountain river">
    <img src="https://picsum.photos/id/1016/400/250" alt="Forest landscape">
    <img src="https://picsum.photos/id/1025/400/250" alt="Dog portrait">
    <img src="https://picsum.photos/id/1035/400/250" alt="Green landscape">
    <img src="https://picsum.photos/id/1043/400/250" alt="Mountain view">
    <img src="https://picsum.photos/id/1069/400/250" alt="Ocean view">
  </div>

  <div class="modal" id="image-modal" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="modal-content" id="modal-content">
      <button class="close-button" id="close-modal" type="button">Close ✕</button>
      <img id="large-image" src="" alt="Large preview">
    </div>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("image-modal");
    const modalContent = document.getElementById("modal-content");
    const largeImage = document.getElementById("large-image");
    const closeModalButton = document.getElementById("close-modal");

    gallery.addEventListener("click", (event) => {
      if (event.target.tagName !== "IMG") return;
      largeImage.src = event.target.src.replace("/400/250", "/1000/700");
      largeImage.alt = event.target.alt;
      modal.classList.add("open");
    });

    // Clicking the backdrop closes the modal.
    modal.addEventListener("click", () => modal.classList.remove("open"));

    // Prevent clicks inside the modal from reaching the backdrop handler.
    modalContent.addEventListener("click", (event) => event.stopPropagation());
    closeModalButton.addEventListener("click", () => modal.classList.remove("open"));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.classList.remove("open");
    });
  </script>
</body>
</html>
