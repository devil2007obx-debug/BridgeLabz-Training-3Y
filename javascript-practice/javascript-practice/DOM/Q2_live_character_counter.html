<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 150px; padding: 12px; font: inherit; }
    #counter { font-weight: bold; margin: 10px 0; color: green; }
    #counter.warning { color: #d99a00; }
    #counter.limit { color: red; }
    button { padding: 9px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Live Character Counter</h1>
  <textarea id="message" maxlength="100" placeholder="Type up to 100 characters..."></textarea>
  <p id="counter" aria-live="polite">100 characters remaining</p>
  <button id="reset-button" type="button">Reset</button>

  <script>
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");
    const resetButton = document.getElementById("reset-button");
    const maxCharacters = 100;

    function updateCounter() {
      const remaining = maxCharacters - message.value.length;
      counter.textContent = `${remaining} characters remaining`;
      counter.classList.toggle("warning", remaining <= 20 && remaining > 0);
      counter.classList.toggle("limit", remaining === 0);
    }

    // maxlength prevents extra typed characters; beforeinput explicitly blocks
    // input that would exceed the limit, including many paste operations.
    message.addEventListener("beforeinput", (event) => {
      const isInsertion = event.inputType.startsWith("insert");
      if (isInsertion && message.value.length >= maxCharacters) {
        event.preventDefault();
      }
    });

    message.addEventListener("input", updateCounter);

    resetButton.addEventListener("click", () => {
      message.value = "";
      updateCounter();
      message.focus();
    });
  </script>
</body>
</html>
